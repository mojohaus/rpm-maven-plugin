version: 2
updates:
- package-ecosystem: maven
  directory: "/"
  exclude-paths:
    - "src/it/**"
    - "src/test/resources/**"
    - "src/it-repo/**"
  schedule:
    interval: monthly
  groups:
    maven:
      patterns: ["*"]
      update-types: ["minor", "patch"]
  ignore:
    # Stay on the Maven 3.9.x line; 3.10 is not the plugin baseline yet
    - dependency-name: "org.apache.maven:maven-artifact"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-core"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-model"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-plugin-api"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-settings"
      versions: [">= 3.10.0"]
    # plexus-sec-dispatcher 3.x requires Java 17; the plugin still runs on Java 8
    - dependency-name: "org.codehaus.plexus:plexus-sec-dispatcher"
      versions: [">= 3.0.0"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  groups:
    github-actions:
      patterns: ["*"]
